[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.16.0"

# Existing English files take precedence; unresolved English paths use EN copy.
[[redirects]]
  from = "/en/*"
  to = "/en/404/"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
